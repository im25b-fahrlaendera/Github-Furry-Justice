<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>FUR(R)Y Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1b1f1c; overflow: hidden; }
    body { font-family: 'Segoe UI', Arial, sans-serif; color: #eee; }

    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center;
    }
    .hidden { display: none !important; }

    h1 { font-size: 28px; font-weight: 600; letter-spacing: 1px; }
    p.hint { font-size: 13px; color: #9a9a9a; }

    .input-field {
      font-size: 20px;
      padding: 10px 16px;
      background: #232823;
      border: 1px solid #444;
      color: #eee;
      border-radius: 4px;
      width: 240px;
      text-align: center;
      letter-spacing: 2px;
    }
    .input-field:focus {
      border-color: #6ea768;
      outline: none;
    }

    .mode-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button {
      font: inherit; font-size: 14px; padding: 9px 18px; cursor: pointer;
      background: #34402f; color: #eee; border: 1px solid #4c5a45;
      border-radius: 4px;
    }
    button:hover { background: #3f4d38; }
    button.primary { background: #4d7a4a; border-color: #6ea768; }
    button.primary:hover { background: #5c8e58; }

    #room-code { font-size: 20px; letter-spacing: 3px; color: #b9d6ab; }

    #game-shell { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #101410; }
    canvas { background: #78a95c; max-width: 100%; max-height: 100%; cursor: none; }

    #crosshair {
      position: fixed; width: 16px; height: 16px; pointer-events: none;
      border: 1px solid #fff; border-radius: 50%; transform: translate(-50%, -50%);
    }

    #toast {
      position: fixed; bottom: 16px; left: 50%; transform: translate(-50%, 10px);
      background: rgba(0,0,0,.6); padding: 6px 12px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s;
      border-radius: 4px;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #end-stats { font-size: 13px; color: #ccc; }

    .multi-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .legend {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: #aaa;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .legend-dot.heal { background: #e95159; }
    .legend-dot.ammo { background: #efd766; }
  </style>
</head>
<body>

<!-- START -->
<div id="start-screen" class="screen">
  <h1>FUR(R)Y Arena</h1>
  <input type="text" id="player-name" class="input-field" placeholder="Name" maxlength="16" value="Spieler" autofocus>

  <div class="legend">
    <span class="legend-item"><span class="legend-dot heal"></span> Heilung</span>
    <span class="legend-item"><span class="legend-dot ammo"></span> Munition</span>
  </div>

  <div id="mode-select" class="mode-row">
    <button id="solo-button" class="primary">Solo</button>
    <button id="multi-button">Multiplayer</button>
  </div>

  <div id="multi-panel" class="multi-panel hidden">
    <div class="mode-row">
      <button id="host-button">Raum erstellen</button>
      <button id="join-button">Raum beitreten</button>
    </div>
    <div id="room-code" class="hidden"></div>
    <div id="join-code-entry" class="hidden">
      <input type="text" id="room-code-input" class="input-field" placeholder="Code" maxlength="4" style="text-transform:uppercase">
      <button id="code-confirm" class="primary">Beitreten</button>
    </div>
    <div id="mp-status" class="hint"></div>
    <button id="mp-start-button" class="primary hidden">Start</button>
  </div>
</div>

<!-- GAME -->
<div id="game-shell" class="hidden">
  <canvas id="game" width="1280" height="720" tabindex="0"></canvas>
</div>
<div id="crosshair" class="hidden"></div>
<div id="toast"></div>

<!-- END -->
<div id="end-screen" class="screen hidden">
  <h1 id="end-title">Runde vorbei</h1>
  <p id="end-stats"></p>
  <button id="again-button" class="primary">Nochmal</button>
</div>

<script src="game.js"></script>
</body>
</html>
