<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GitHub Furry Justice</title>
<style>
  html, body {
    margin: 0;
    background: #1b1f27;
    overflow: hidden;
    font-family: sans-serif;
    color: #eee;
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 14px;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    border-radius: 6px;
  }
  canvas {
    display: block;
    background: #232833;
  }
</style>
</head>
<body>
<div id="hud">Verbinde...</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const ANIMAL_EMOJI = {
  fox: "🦊", wolf: "🐺", raccoon: "🦝",
  otter: "🦦", bear: "🐻", cat: "🐱"
};

let myId = null;
let world = { width: 1600, height: 900 };
let players = [];

const ws = new WebSocket(`ws://${location.host}/ws`);

ws.onopen = () => { hud.textContent = "Verbunden. Bewege dich mit WASD / Pfeiltasten."; };

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  if (msg.type === "welcome") {
    myId = msg.id;
  } else if (msg.type === "state") {
    world = msg.world;
    players = msg.players;
    render();
  }
};

ws.onclose = () => { hud.textContent = "Verbindung getrennt."; };

const keys = { up: false, down: false, left: false, right: false };

function sendInput() {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "input", ...keys }));
  }
}

window.addEventListener("keydown", (e) => {
  if (["w", "ArrowUp"].includes(e.key)) keys.up = true;
  if (["s", "ArrowDown"].includes(e.key)) keys.down = true;
  if (["a", "ArrowLeft"].includes(e.key)) keys.left = true;
  if (["d", "ArrowRight"].includes(e.key)) keys.right = true;
  sendInput();
});

window.addEventListener("keyup", (e) => {
  if (["w", "ArrowUp"].includes(e.key)) keys.up = false;
  if (["s", "ArrowDown"].includes(e.key)) keys.down = false;
  if (["a", "ArrowLeft"].includes(e.key)) keys.left = false;
  if (["d", "ArrowRight"].includes(e.key)) keys.right = false;
  sendInput();
});

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const offsetX = (canvas.width - world.width) / 2;
  const offsetY = (canvas.height - world.height) / 2;

  ctx.strokeStyle = "#3a4152";
  ctx.lineWidth = 3;
  ctx.strokeRect(offsetX, offsetY, world.width, world.height);

  for (const p of players) {
    const x = p.x + offsetX;
    const y = p.y + offsetY;

    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    if (p.id === myId) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#fff";
      ctx.stroke();
    }

    ctx.font = "22px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ANIMAL_EMOJI[p.animal] || "🐾", x, y - 2);

    ctx.font = "11px sans-serif";
    ctx.fillStyle = "#ccc";
    ctx.fillText(p.id === myId ? "Du" : p.id, x, y + 32);
  }

  hud.textContent = `Spieler online: ${players.length}`;
}

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
